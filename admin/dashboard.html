<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Admin Dashboard - Electric Ink</title>
  <link rel="stylesheet" href="/css/admin-dashboard.css">
  <link rel="stylesheet" href="/css/main.css">
  <script src="/js/firebase-client-config.js" defer></script>
</head>
<body>
  <header class="admin-header">
    <div class="admin-header-container">
      <h1>Electric Ink - Admin</h1>
      <div class="admin-user" data-admin-only>
        <span id="admin-name">Loading...</span>
        <button id="exitDashboardBtn" class="btn-secondary">Exit Dashboard</button>
      </div>
    </div>
  </header>

  <main class="admin-main">
    <section class="admin-stats">
      <div class="stat-card">
        <h3>Pending Orders</h3>
        <p class="stat-number" id="pending-count">0</p>
      </div>
      <div class="stat-card">
        <h3>Today's Sales</h3>
        <p class="stat-number" id="today-sales">€0.00</p>
      </div>
      <div class="stat-card">
        <h3>Total Orders</h3>
        <p class="stat-number" id="total-orders">0</p>
      </div>
    </section>

    <section class="admin-orders">
      <div class="section-header">
        <h2>Recent Orders</h2>
        <select id="status-filter">
          <option value="all">All</option>
          <option value="pending">Pending</option>
          <option value="shipped">Shipped</option>
          <option value="delivered">Delivered</option>
        </select>
      </div>

      <div class="orders-table">
        <table>
          <thead>
            <tr>
              <th>Order ID</th>
              <th>Customer</th>
              <th>Date</th>
              <th>Total</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="orders-tbody">
            <tr><td colspan="6">Loading...</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <!-- Order Details Modal -->
  <div id="order-modal" class="modal" style="display:none;">
    <div class="modal-content">
      <button class="close" onclick="window.closeModal()">&times;</button>
      <h2>Order Details</h2>
      <div id="order-details"></div>
      
      <div class="modal-actions">
        <!-- Initial state: Show button to trigger shipping form -->
        <button id="show-shipping-form-btn" class="btn-primary" style="display:block;">
          Mark as Shipped
        </button>

        <!-- Shipping form (hidden initially) -->
        <div id="shipping-form-container" class="shipping-form" style="display:none;">
          <form id="shipping-form">
            <div class="form-group">
              <label class="form-label" for="carrier">Carrier *</label>
              <select id="carrier" name="carrier" class="form-select" required>
                <option value="">Select carrier...</option>
                <option value="anpost">An Post</option>
                <option value="dpd">DPD Ireland</option>
                <option value="fastway">Fastway Couriers</option>
                <option value="ups">UPS</option>
                <option value="dhl">DHL Express</option>
                <option value="custom">Other / Custom</option>
              </select>
            </div>

            <div class="form-group">
              <label class="form-label" for="tracking-number">Tracking Number *</label>
              <input 
                id="tracking-number" 
                name="trackingNumber" 
                type="text" 
                class="form-input"
                placeholder="RR123456789IE"
                required 
                autocomplete="off" 
              />
            </div>

            <div class="form-group">
              <label class="form-label" for="estimated-delivery">Estimated Delivery (optional)</label>
              <input 
                id="estimated-delivery" 
                name="estimatedDelivery" 
                type="date" 
                class="form-input"
              />
            </div>

            <div class="form-group">
              <label class="form-checkbox-group">
                <input id="send-email-checkbox" name="sendEmail" type="checkbox" checked />
                <span>Send shipping email to customer</span>
              </label>
            </div>

            <!-- Form action buttons -->
            <div class="form-actions">
              <button type="button" id="cancel-shipping-btn" class="btn-secondary">
                Cancel
              </button>
              <button type="submit" class="btn-primary">
                Confirm Shipment
              </button>
            </div>
          </form>
        </div>

        <!-- textual Close button removed; keep close icon in top-right only -->
      </div>
    </div>
  </div>

  <script type="module" src="/js/admin-dashboard.js"></script>
  <script type="module" src="/js/admin-dashboard-init.js"></script>
</body>
</html>
